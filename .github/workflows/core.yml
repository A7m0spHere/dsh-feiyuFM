name: Core offline checks

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    env:
      # Hosted runners cannot open the real media regression WAVs. Keep all
      # protocol/control tests, with real audio verified on a Windows workstation.
      FISHFM_TEST_REAL_AUDIO: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run audit:acceptance
      - run: npm test
      - run: npm run build
      - run: node scripts/dependency-notices.mjs
      - run: npm run verify:package
