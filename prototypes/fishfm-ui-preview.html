<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FishFM UI preview</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:#f3f5f8;color:#172235}
.preview-toolbar{position:fixed;z-index:100;inset:0 0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #dfe3e9;font-size:12px}
.preview-toolbar button{font:inherit;padding:5px 9px;border:1px solid #dfe3e9;border-radius:6px;background:transparent;color:inherit;cursor:pointer}
.preview-note{margin-right:auto;color:#566171}.preview-shell{padding-top:65px;min-height:100vh}.preview-main{width:100%;max-width:1050px;margin:auto;min-height:calc(100vh - 65px)}
[data-shell-overlay]{position:fixed;inset:65px 0 0;pointer-events:none}.preview-conversation{padding:60px 24px;text-align:center;color:#566171}
.preview-settings{max-width:440px;margin:24px auto;border:1px solid #dfe3e9;border-radius:10px;overflow:hidden}
[data-ds-dark-theme] body{background:#11151d;color:#e4e9f2}[data-ds-dark-theme] .preview-toolbar{background:#1b202a;border-color:#303644}
[data-ds-dark-theme] .preview-toolbar button{border-color:#303644}[data-ds-dark-theme] .preview-note{color:#a5adba}
@media(max-width:600px){.preview-toolbar{gap:4px;padding:8px}.preview-note{width:100%;font-size:10px}.preview-shell{padding-top:88px}[data-shell-overlay]{top:88px}}
</style>
<div id="root"></div>
<script src="/react.js"></script><script src="/react-dom.js"></script>
<script>
const registrations=[];let harnessBundle;
// Preview-only media adapter lets QA exercise both motion environments without changing OS settings.
let demoMotion=false;
const nativeMatchMedia=window.matchMedia.bind(window);
window.matchMedia=query=>demoMotion&&query==='(prefers-reduced-motion: reduce)'?{matches:false}:nativeMatchMedia(query);
const previewAnimations=[];
for(const type of ['animationstart','animationend'])document.addEventListener(type,event=>{
 if(event.animationName.startsWith('fm-')){previewAnimations.push({type,name:event.animationName,elapsed:event.elapsedTime});document.documentElement.dataset.motionEvents=JSON.stringify(previewAnimations.slice(-30));}
});
window.__ModuleLoader__={load(def){harnessBundle=def.factory(name=>{if(name!=='react')throw Error(name);return React})}};
</script>
<script src="/client.js"></script>
<script>
const tracks=Array.from({length:100},(_,i)=>({provider:'netease',providerTrackId:String(i+1),title:`示例歌曲 ${String(i+1).padStart(2,'0')}`,artist:i%2?'夜航乐队':'沿途电台',durationMs:180000+i*1000}));
let snapshot={revision:1,settings:{listening:true,humanPlayback:true,discovery:true,discoveryRate:.2,strategy:'normal'},paused:true,status:'paused',queue:[],current:{track:tracks[0],playInstanceId:'preview-1',positionMs:62000},lastError:null};
let connected=true,empty=false,active='fishfm',changeActive;
const connection={rpc:{async call(_channel,endpoint,payload){
 await new Promise(r=>setTimeout(r,80));
 if(!connected)return {ok:false,error:{code:'core_unavailable',message:'预览连接中断'}};
 if(endpoint==='fishfm/command'){
  const type=payload.type;
  if(type==='pause'){snapshot.paused=true;snapshot.status='paused'}
  if(type==='resume'){snapshot.paused=false;snapshot.status='playing';if(!snapshot.current)snapshot.current={track:tracks[0],playInstanceId:'preview-1',positionMs:0}}
  if(type==='requestTrack'||type==='next'){const track=type==='requestTrack'?payload.track:tracks[(Number(snapshot.current?.track.providerTrackId)||0)%tracks.length];snapshot.current={track,playInstanceId:`preview-${Date.now()}`,positionMs:0};if(type==='requestTrack')snapshot.paused=false;snapshot.status=snapshot.paused?'paused':'playing'}
  const field={setListening:'listening',setHumanPlayback:'humanPlayback',setDiscovery:'discovery',setDiscoveryRate:'discoveryRate'}[type];if(field)snapshot.settings[field]=payload.value;
  if(type==='setMode'){snapshot.settings.listening=payload.value!=='off';snapshot.settings.humanPlayback=payload.value==='silent'||payload.value==='off'?false:snapshot.settings.humanPlayback;snapshot.settings.strategy=payload.value==='focus'?'focus':'normal';snapshot.paused=payload.value==='off';snapshot.status=snapshot.paused?'paused':'playing'}
  if(type==='stopForToday'){snapshot.paused=true;snapshot.status='paused';snapshot.blockUntil=Date.now()+3600000}
  snapshot.revision++;return {ok:true,value:{snapshot:structuredClone(snapshot)}};
 }
 return {ok:true,value:{snapshot:structuredClone(snapshot),platforms:{netease:{installed:true,account:{status:'authorized'}},qq:{installed:false}},library:{total:empty?0:100,tracks:empty?[]:tracks}}};
}}};
const layout={selectPanel(id){active=id;changeActive?.(id)}};
harnessBundle.apply({connection,layout,effect(fn){fn()},slots:{inject(_name,fn){fn()},register(options,component){registrations.push({options,component});return()=>{}}}});
const panel=registrations.find(r=>r.options.name==='main'),overlay=registrations.find(r=>r.options.name==='shell.overlay'),controller=panel.options.inject().controller;
const previewStyle=document.querySelector('style[data-plugin="fishfm"]'),normalCss=previewStyle.textContent;
function Harness(){
 const [page,setPage]=React.useState(active),[dark,setDark]=React.useState(false),[settings,setSettings]=React.useState(false),[demo,setDemo]=React.useState(false);changeActive=setPage;
 const show=id=>{active=id;setPage(id)};
 return React.createElement(React.Fragment,null,
  React.createElement('header',{className:'preview-toolbar'},React.createElement('span',{className:'preview-note'},'界面预览 · 模拟数据 · 不播放声音'),
   React.createElement('button',{onClick:()=>{document.documentElement.toggleAttribute('data-ds-dark-theme',!dark);setDark(!dark)}},dark?'浅色':'深色'),
   React.createElement('button',{onClick:()=>show(page==='fishfm'?null:'fishfm')},page==='fishfm'?'对话':'电台'),
   React.createElement('button',{onClick:()=>setSettings(!settings)},settings?'主面板':'设置宽度'),
   React.createElement('button',{onClick:()=>{demoMotion=!demo;previewStyle.textContent=demoMotion?normalCss.replace('@media(prefers-reduced-motion:reduce)','@media(preview-motion:none)'):normalCss;controller.setMotion('full');setDemo(!demo)}},demo?'系统动效':'动效演示'),
   React.createElement('button',{onClick:()=>{empty=!empty;controller.refresh()}},'切换空库'),
   React.createElement('button',{onClick:()=>{connected=!connected;controller.refresh()}},'切换连接')),
  React.createElement('div',{className:'preview-shell'},page==='fishfm'?React.createElement('main',{className:settings?'preview-settings':'preview-main'},React.createElement(panel.component,{...panel.options.inject(),...(settings?{close:()=>setSettings(false)}:{})})):React.createElement('div',{className:'preview-conversation'},'对话面板 · 音乐服务独立于可见页面'),
   React.createElement('div',{'data-shell-overlay':''},React.createElement(overlay.component,{...overlay.options.inject(),usePanelInfo:fn=>fn({activePanelId:page})}))));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Harness));
setInterval(()=>{if(!snapshot.paused&&snapshot.current)snapshot.current.positionMs=Math.min(snapshot.current.positionMs+1000,snapshot.current.track.durationMs)},1000);
</script>
</html>
