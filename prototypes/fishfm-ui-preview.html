<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FishFM UI preview</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:#f3f5f8;color:#172235}
.preview-toolbar{position:fixed;z-index:100;inset:0 0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #dfe3e9;font-size:12px}
.preview-toolbar button{font:inherit;padding:5px 9px;border:1px solid #dfe3e9;border-radius:6px;background:transparent;color:inherit;cursor:pointer}
.preview-note{margin-right:auto;color:#566171}.preview-shell{padding-top:65px;min-height:100vh}.preview-main{width:100%;max-width:1050px;margin:auto;height:calc(100vh - 65px)}
[data-shell-overlay]{position:fixed;inset:65px 0 0;pointer-events:none}.preview-conversation{padding:60px 24px;text-align:center;color:#566171}
.preview-settings{max-width:440px;margin:24px auto;border:1px solid #dfe3e9;border-radius:10px;overflow:hidden;height:calc(100vh - 113px)}
[data-ds-dark-theme] body{background:#11151d;color:#e4e9f2}[data-ds-dark-theme] .preview-toolbar{background:#1b202a;border-color:#303644}
[data-ds-dark-theme] .preview-toolbar button{border-color:#303644}[data-ds-dark-theme] .preview-note{color:#a5adba}
@media(max-width:600px){.preview-toolbar{gap:4px;padding:8px}.preview-note{width:100%;font-size:10px}.preview-shell{padding-top:88px}.preview-main{height:calc(100vh - 88px)}[data-shell-overlay]{top:88px}}
</style>
<div id="root"></div>
<script src="/react.js"></script><script src="/react-dom.js"></script>
<script>
const registrations=[];let harnessBundle;
// Preview-only media adapter lets QA exercise both motion environments without changing OS settings.
let demoMotion=false;
const nativeMatchMedia=window.matchMedia.bind(window);
window.matchMedia=query=>demoMotion&&query==='(prefers-reduced-motion: reduce)'?{matches:false}:nativeMatchMedia(query);
const previewAnimations=[];
for(const type of ['animationstart','animationend'])document.addEventListener(type,event=>{
 if(event.animationName.startsWith('fm-')){previewAnimations.push({type,name:event.animationName,elapsed:event.elapsedTime});document.documentElement.dataset.motionEvents=JSON.stringify(previewAnimations.slice(-30));}
});
window.__ModuleLoader__={load(def){harnessBundle=def.factory(name=>{if(name!=='react')throw Error(name);return React})}};
</script>
<script src="/client.js"></script>
<script type="module">
const tracks=Array.from({length:100},(_,i)=>({provider:'netease',providerTrackId:String(i+1),title:`示例歌曲 ${String(i+1).padStart(2,'0')}`,artist:i%2?'夜航乐队':'沿途电台',durationMs:180000+i*1000}));
const artwork=await fetch('/artwork.json').then(response=>response.json());
let snapshot={revision:1,settings:{listening:true,humanPlayback:false,discovery:true,discoveryRate:.7,strategy:'normal'},paused:true,status:'paused',queue:[],current:{track:tracks[0],selectedBy:'agent',playInstanceId:'preview-1',positionMs:62000,origin:{source:'netease_similar'}},lastError:null,discovery:{state:'ready',count:34,sources:['netease_similar','netease_daily']}};
// Isolated display fixtures. These numbers are not production evidence or model usage.
const persona={generatedAt:Date.now(),facts:{artists:[{key:'a1',name:'沿途电台'},{key:'a2',name:'夜航乐队'},{key:'a3',name:'落日飞行'}],validListens:42,exploration:70,discoveryEnabled:true},
 summary:{provider:'preview',model:'example-model',trigger:'manual',generatedAt:Date.now(),text:'最近的有效经历更偏向沿途电台与夜航乐队。接下来会结合这些艺人的相似歌曲，保留 70% 的探索目标，在熟悉与陌生候选之间选择。\n这些是已记录的音乐偏好，流派和情绪尚无数据。',usage:{inputTokens:166,outputTokens:83}},summaryStale:false,
 policy:{dailyTokens:4000,maxOutputTokens:256,outputMaximumTokens:256,minOutputTokens:64,maxPromptBytes:1500,factsBytes:682,automatic:false,automaticDue:false,automaticBlockedBy:'disabled',autoMinNewListens:50,automaticNewListens:2},
 ledger:{localDecisionRequests:0,today:{knownTokens:696},total:{knownTokens:696,attempts:2,unknownCalls:0},remainingTokens:3304,recent:[{callId:'preview-1',model:'example-model',status:'completed',startedAt:Date.now(),usage:{inputTokens:166,outputTokens:83}},{callId:'preview-2',model:'example-model',status:'failed',startedAt:Date.now()-60000,usage:{inputTokens:191,outputTokens:256}}]}};
const insights={feedback:{version:1,current:0,liked:0,reduced:0,resetAt:null,canUndoReset:false},explanation:{text:'从沿途电台的相似候选中选择，避免连续重复同一位艺人。'},reply:{decisionId:'preview-1',text:'这首来自沿途电台的相似推荐。想沿着最近的偏好，听一点没听过的声音。'},profile:{artists:[{key:'a1',name:'沿途电台',affinity:.74,source:'listen_silent'},{key:'a2',name:'夜航乐队',affinity:.69,source:'listen'}],tracks:[{key:'t1',title:'示例歌曲 01',affinity:.53,source:'listen_silent'}]},recentChanges:[{playInstanceId:'preview-1',title:'示例歌曲 01',before:.5,after:.53,audible:false}],statistics:{retainedDecisions:42,explorationAttempts:28,unfamiliarSelections:17,observedStarts:42,validUnfamiliarListens:11,repeatedSelections:3},decisions:[]};
const votes=new Map();let previewResetBackup=null;
persona.recommendationsSupported=true;persona.referenceCoverage={total:100,sampled:8};insights.libraryResetSupported=true;insights.recommendationMode='filtered';
const previewPicks=()=>[1,3,5,7].map((index,rank)=>({...tracks[index],discovery:{source:'netease_similar',llmRank:rank+1,llmReason:rank%2?'想试一点不同的':'和参考歌曲相近'}}));
persona.recommendationRoute={provider:'preview',model:'example-model'};
persona.recommendationPipeline={pipeline:'platform-filter',state:'ready',count:34,picked:4,remaining:4,referenceCount:100,tracks:previewPicks(),summary:'沿着你常听的歌，挑了几首想试试的。',selectionComplete:true};
snapshot.discovery=persona.recommendationPipeline;
const summaryModels=[{provider:'preview',model:'example-model',label:'已配置模型 · 示例总结路线'}];
let connected=true,empty=false,active='fishfm',changeActive;
const connection={rpc:{async call(_channel,endpoint,payload){
 await new Promise(r=>setTimeout(r,80));
 if(!connected)return {ok:false,error:{code:'core_unavailable',message:'预览连接中断'}};
 if(endpoint.startsWith('fishfm/persona-')){
  if(endpoint==='fishfm/persona-recommendations'){
   await new Promise(r=>setTimeout(r,600));
   persona.recommendationPipeline={...persona.recommendationPipeline,tracks:previewPicks().reverse(),picked:4,remaining:4,referenceCount:empty?0:100};
   persona.recommendationRoute={provider:payload.provider,model:payload.model};snapshot.discovery=persona.recommendationPipeline;
  }
  if(endpoint==='fishfm/persona-budget')persona.policy.dailyTokens=payload.value;
  if(endpoint==='fishfm/persona-output')persona.policy.maxOutputTokens=payload.value;
  if(endpoint==='fishfm/persona-automatic')persona.policy.automatic=payload.value;
  if(endpoint==='fishfm/persona-summary')await new Promise(r=>setTimeout(r,1500));
  persona.generatedAt=Date.now();return {ok:true,value:{persona:structuredClone(persona),summaryResult:{cached:false}}};
 }
 if(endpoint==='fishfm/command'){
  const type=payload.type;
  if(type==='setTrackFeedback')votes.set(payload.track.providerTrackId,payload.value);
  if(type==='setRecommendationMode')insights.recommendationMode=payload.value;
  if(type==='resetTaste'||type==='resetLibrary'){
   previewResetBackup={votes:[...votes],summary:structuredClone(persona.summary),empty,recommendations:persona.recommendations};
   if(type==='resetLibrary'){empty=true;persona.referenceCoverage={total:0,sampled:0};}
   persona.recommendations=null;
   if(payload.value.clearFeedback)votes.clear();persona.summary=null;insights.feedback.resetAt=Date.now();insights.feedback.canUndoReset=true;
  }
  if(type==='undoTasteReset'&&previewResetBackup){for(const [key,value] of previewResetBackup.votes)if(!votes.has(key))votes.set(key,value);persona.summary=previewResetBackup.summary;empty=previewResetBackup.empty;persona.referenceCoverage={total:empty?0:100,sampled:empty?0:8};persona.recommendations=previewResetBackup.recommendations;insights.feedback.resetAt=null;insights.feedback.canUndoReset=false;previewResetBackup=null;}
  if(type==='pause'){snapshot.paused=true;snapshot.status='paused'}
  if(type==='resume'){snapshot.paused=false;snapshot.status='playing';if(!snapshot.current)snapshot.current={track:tracks[0],playInstanceId:'preview-1',positionMs:0}}
  if(type==='requestTrack'||type==='next'){const track=type==='requestTrack'?payload.track:persona.recommendationPipeline.tracks[(Number(snapshot.current?.track.providerTrackId)||0)%persona.recommendationPipeline.tracks.length]??tracks[0];snapshot.current={track,selectedBy:type==='requestTrack'?'user':'agent',selectionTrigger:type==='requestTrack'?'user-track':'user-next',origin:type==='next'?track.discovery:null,playInstanceId:`preview-${Date.now()}`,positionMs:0};if(type==='requestTrack')snapshot.paused=false;snapshot.status=snapshot.paused?'paused':'playing';if(type==='next'){insights.reply.text=`我从网易云找来的歌里挑了这首：${track.discovery?.llmReason??'想试一点不同的'}。`;insights.explanation.text=insights.reply.text;}}
  const field={setListening:'listening',setHumanPlayback:'humanPlayback',setDiscovery:'discovery',setDiscoveryRate:'discoveryRate'}[type];if(field)snapshot.settings[field]=payload.value;
  if(type==='setMode'){snapshot.settings.listening=payload.value!=='off';snapshot.settings.humanPlayback=payload.value==='silent'||payload.value==='off'?false:snapshot.settings.humanPlayback;snapshot.settings.strategy=payload.value==='focus'?'focus':'normal';snapshot.paused=payload.value==='off';snapshot.status=snapshot.paused?'paused':'playing'}
  if(type==='stopForToday'){snapshot.paused=true;snapshot.status='paused';snapshot.blockUntil=Date.now()+3600000}
  insights.feedback.current=votes.get(snapshot.current?.track.providerTrackId)??0;insights.feedback.liked=[...votes.values()].filter(v=>v===1).length;insights.feedback.reduced=[...votes.values()].filter(v=>v===-1).length;
  snapshot.revision++;return {ok:true,value:{snapshot:structuredClone(snapshot),insights:structuredClone(insights),persona:structuredClone(persona),library:{total:empty?0:100,tracks:empty?[]:tracks}}};
 }
 persona.recommendationPipeline.referenceCount=empty?0:100;
 return {ok:true,value:{snapshot:structuredClone(snapshot),persona:structuredClone(persona),insights:structuredClone(insights),summaryModels,features:{personaSummary:true,discoveryRefresh:true,importSources:true,artwork},platforms:{netease:{installed:true,account:{status:'authorized'}},qq:{installed:false}},library:{total:empty?0:100,tracks:empty?[]:tracks},playlists:[{id:'preview-list',title:'示例输入歌单'}]}};
}}};
const layout={selectPanel(id){active=id;changeActive?.(id)}};
harnessBundle.apply({connection,layout,effect(fn){fn()},slots:{inject(_name,fn){fn()},register(options,component){registrations.push({options,component});return()=>{}}}});
const panel=registrations.find(r=>r.options.name==='main'),overlay=registrations.find(r=>r.options.name==='shell.overlay'),controller=panel.options.inject().controller;
const previewStyle=document.querySelector('style[data-plugin="fishfm"]'),normalCss=previewStyle.textContent;
function Harness(){
 const [page,setPage]=React.useState(active),[dark,setDark]=React.useState(false),[settings,setSettings]=React.useState(false),[demo,setDemo]=React.useState(false);changeActive=setPage;
 const show=id=>{active=id;setPage(id)};
 return React.createElement(React.Fragment,null,
  React.createElement('header',{className:'preview-toolbar'},React.createElement('span',{className:'preview-note'},'界面预览 · 模拟数据 · 不播放声音'),
   React.createElement('button',{onClick:()=>{document.documentElement.toggleAttribute('data-ds-dark-theme',!dark);setDark(!dark)}},dark?'浅色':'深色'),
   React.createElement('button',{onClick:()=>show(page==='fishfm'?null:'fishfm')},page==='fishfm'?'对话':'电台'),
   React.createElement('button',{onClick:()=>setSettings(!settings)},settings?'主面板':'设置宽度'),
   React.createElement('button',{onClick:()=>{demoMotion=!demo;previewStyle.textContent=demoMotion?normalCss.replace('@media(prefers-reduced-motion:reduce)','@media(preview-motion:none)'):normalCss;controller.setMotion('full');setDemo(!demo)}},demo?'系统动效':'动效演示'),
   React.createElement('button',{onClick:()=>{empty=!empty;controller.refresh()}},'切换空库'),
   React.createElement('button',{onClick:()=>{connected=!connected;controller.refresh()}},'切换连接')),
  React.createElement('div',{className:'preview-shell'},page==='fishfm'?React.createElement('main',{className:settings?'preview-settings':'preview-main'},React.createElement(panel.component,{...panel.options.inject(),...(settings?{close:()=>setSettings(false)}:{})})):React.createElement('div',{className:'preview-conversation'},'对话面板 · 音乐服务独立于可见页面'),
   React.createElement('div',{'data-shell-overlay':''},React.createElement(overlay.component,{...overlay.options.inject(),usePanelInfo:fn=>fn({activePanelId:page})}))));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Harness));
setInterval(()=>{if(!snapshot.paused&&snapshot.current)snapshot.current.positionMs=Math.min(snapshot.current.positionMs+1000,snapshot.current.track.durationMs)},1000);
</script>
