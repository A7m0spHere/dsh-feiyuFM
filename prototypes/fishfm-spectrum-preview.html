<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FishFM U22 · ASCII Fluid Spectrum A/B</title>
<style>
*{box-sizing:border-box}body{margin:0;min-width:1120px;background:#fff;color:#24324a;font:14px system-ui,sans-serif}
header{padding:24px 32px;display:flex;gap:20px;align-items:center;border-bottom:1px solid #e8ebf0}
button,select{font:inherit}main{display:flex;gap:80px;padding:24px 40px}section{flex:0 0 240px}
h2{font-size:15px;font-weight:500}.field.fm-spectrum-bg{position:relative;width:160px;height:760px}
body.dark{background:#15171c;color:#e6eafa}
output{font-size:12px;font-variant-numeric:tabular-nums}p{max-width:480px;line-height:1.8;color:#70798a}
</style>
<header><strong>ASCII Fluid Spectrum</strong><span>模拟频段 · 同尺寸、同时间、同输入</span>
<select id="fps" aria-label="绘制频率"><option>24</option><option>12</option></select><span>fps</span>
<button id="theme">深浅色</button><button id="pause">播放 / 暂停</button><output id="perf"></output></header>
<main><section><h2>A · 左锚密度条</h2><div class="field fm-spectrum-bg" data-ready="true" data-active="true"><canvas id="a"></canvas></div></section>
<section><h2>B · 末端上下轻摆</h2><div class="field fm-spectrum-bg" data-ready="true" data-active="true"><canvas id="b"></canvas></div></section>
<aside><p>无鲸鱼方向预览：两个区域均为 160 × 760px，使用生产字色、透明度与渐隐。频段从上到下排列，左端固定，能量增加向右伸长、下降向左回缩。</p>
<p>相同亮度场映射到字符；B 用 Canvas 保留亚字符位移。没有复制时钟、引擎或引入 Three.js。</p></aside></main>
<script type="module">
import {createSpectrumEngine,createSpectrumDriver,renderSpectrumScene} from '/spectrum-bars.mjs';
import {createSpectrumPainter} from '/spectrum-canvas.mjs';
import {css} from '/spectrum-styles.mjs';
const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
const driver=createSpectrumDriver({engine:createSpectrumEngine({bands:28,seed:42})});
const painters=['a','b'].map(id=>createSpectrumPainter(document.getElementById(id)));
let playing=true,last=0,draws=0,total=0,samples=[[],[]];
window.spectrumMetrics={frames:0,totalMs:0,maxMs:0,samples};
document.getElementById('fps').onchange=()=>{draws=0;total=0;samples=[[],[]];window.spectrumMetrics={frames:0,totalMs:0,maxMs:0,samples};};
document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');
document.getElementById('pause').onclick=()=>{playing=!playing;document.querySelectorAll('.field').forEach(e=>e.dataset.active=String(playing));};
function tick(now){
 const {frame,phase}=driver.advance(now,{active:playing,energy:.9});
 const interval=1000/Number(document.getElementById('fps').value);
 if(now-last>=interval&&frame.values.length){
  last=now-(now-last)%interval;const start=performance.now();
  painters.forEach((p,i)=>{const before=performance.now();p.paint(renderSpectrumScene(frame.values,frame.peaks,26,63,{phase,ramp:p.ramp,fluid:i===1}));
   if(draws>=10&&samples[i].length<600)samples[i].push(performance.now()-before);});
  const ms=performance.now()-start;draws++;total+=ms;
  Object.assign(window.spectrumMetrics,{frames:draws,totalMs:total,maxMs:Math.max(ms,window.spectrumMetrics.maxMs),phase});
  if(draws%24===0){
   const stats=samples.map(list=>{const sorted=[...list].sort((a,b)=>a-b);return {n:list.length,mean:list.reduce((a,b)=>a+b,0)/Math.max(1,list.length),p95:sorted[Math.floor(sorted.length*.95)]??0};});
   const output=document.getElementById('perf');output.textContent=`A+B 平均 ${(total/draws).toFixed(2)}ms / 帧`;
   output.dataset.stats=JSON.stringify({fps:Number(document.getElementById('fps').value),frames:draws,stats});
  }
 }
 requestAnimationFrame(tick);
}requestAnimationFrame(tick);
</script></html>
